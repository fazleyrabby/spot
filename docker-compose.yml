services:
  postgres:
    image: postgres:16-alpine
    container_name: spot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spot_db
      POSTGRES_USER: spot_user
      POSTGRES_PASSWORD: spot_secret_password
    ports:
      - "55432:5432"
    volumes:
      - spot_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spot_user -d spot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  spot_pgdata:
